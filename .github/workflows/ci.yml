# runs pytest, ruff and the import check on every pull request and every push to any branch, Railway's Wait for CI holds the deploy on it

name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # matches the Dockerfile, python:3.12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
      - run: ruff check
      # checks imports against .importlinter, the module map in docs/diagrams/dependency.md
      - run: lint-imports
        env:
          PYTHONPATH: Source
